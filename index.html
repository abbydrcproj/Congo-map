<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        .timeline-control {
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            font-family: sans-serif;
            min-width: 250px;
            z-index: 1000;
            position: absolute;
            bottom: 25px;
            left: 20px;
        }
        .timeline-control input {
            width: 100%;
            margin-top: 8px;
        }
        </style>
        <title>Congo Map</title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/leaflet-rotatedmarker.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>

        <script>
        var map = L.map('map', {
            zoomControl: true, maxZoom: 28, minZoom: 1
        }).setView([-2.5, 23.5], 6);

        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

        var layer_OSMStandard_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        layer_OSMStandard_0.addTo(map);

        // Add custom date slider
        var sliderDiv = document.createElement('div');
        sliderDiv.className = 'timeline-control';
        sliderDiv.innerHTML = `
            <div><b>Date Filter:</b> <span id="time-display">2026-01-01</span></div>
            <input type="range" id="time-slider" min="1" max="4" value="1" step="1">
        `;
        document.body.appendChild(sliderDiv);

        var dates = ["2026-01-01", "2026-03-01", "2026-05-01", "2026-07-01"];

        document.getElementById('time-slider').addEventListener('input', function(e) {
            var idx = parseInt(e.target.value) - 1;
            var selectedDateStr = dates[idx];
            document.getElementById('time-display').innerText = selectedDateStr;

            var selectedDate = new Date(selectedDateStr);

            map.eachLayer(function(layer) {
                if (layer.eachLayer) {
                    layer.eachLayer(function(subLayer) {
                        if (subLayer.feature && subLayer.feature.properties) {
                            var props = subLayer.feature.properties;
                            if (props.date) {
                                var start = new Date(props.date);
                                var end = props.end_date ? new Date(props.end_date) : start;

                                var isVisible = (selectedDate >= start && selectedDate <= end);
                                if (subLayer._path) subLayer._path.style.display = isVisible ? 'block' : 'none';
                                if (subLayer.getElement && subLayer.getElement()) {
                                    subLayer.getElement().style.display = isVisible ? 'block' : 'none';
                                }
                            }
                        }
                    });
                }
            });
        });
        </script>
    </body>
</html>
