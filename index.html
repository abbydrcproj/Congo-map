<!DOCTYPE html>
<html>
<head>
    <title>Congo Interactive Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet & Timeline CSS/JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-timeline-slider@1.0.0/dist/leaflet-timeline-slider.min.js"></script>

    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // Initialize full-screen map centered on Congo region
    var map = L.map('map').setView([-0.228, 15.827], 6);

    // OpenStreetMap Base Tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{g}/{x}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    var geojsonLayer;

    // Fetch Congo1_data.geojson from repository
    fetch('Congo1_data.geojson')
        .then(response => response.json())
        .then(data => {
            geojsonLayer = L.geoJSON(data, {
                onEachFeature: function (feature, layer) {
                    if (feature.properties) {
                        var popupText = "";
                        for (var prop in feature.properties) {
                            popupText += "<b>" + prop + ":</b> " + feature.properties[prop] + "<br>";
                        }
                        layer.bindPopup(popupText);
                    }
                }
            }).addTo(map);

            // Time filtering function matching 'date' and 'end_date'
            function filterByDate(selectedDate) {
                var current = new Date(selectedDate);
                geojsonLayer.clearLayers();
                
                L.geoJSON(data, {
                    filter: function(feature) {
                        if (!feature.properties.date) return true;
                        var start = new Date(feature.properties.date);
                        var end = feature.properties.end_date ? new Date(feature.properties.end_date) : start;
                        return current >= start && current <= end;
                    },
                    onEachFeature: function (feature, layer) {
                        if (feature.properties) {
                            var popupText = "";
                            for (var prop in feature.properties) {
                                popupText += "<b>" + prop + ":</b> " + feature.properties[prop] + "<br>";
                            }
                            layer.bindPopup(popupText);
                        }
                    }
                }).addTo(geojsonLayer);
            }

            // Timeline slider initialization
            L.control.timelineSlider({
                timelineItems: ["2026-01-01", "2026-03-01", "2026-05-01", "2026-07-01"],
                changeMap: function(e) {
                    filterByDate(e.value);
                }
            }).addTo(map);
        });
</script>

</body>
</html>
fetch('Congo1_data.geojson') // Must match the exact file name in your GitHub file list
