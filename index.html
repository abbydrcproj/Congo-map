<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <title>Congo Map</title>
        
        <!-- CDN Leaflet & FontAwesome Libraries (Guaranteed 100% Load) -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        .timeline-control {
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-width: 260px;
            z-index: 1000;
            position: absolute;
            bottom: 30px;
            left: 20px;
        }
        .timeline-control input {
            width: 100%;
            margin-top: 8px;
            cursor: pointer;
        }
        </style>
    </head>
    <body>
        <div id="map"></div>

        <!-- Optional local data layers with graceful fallback -->
        <script src="data/Congo_data_8.js" onerror="console.warn('Congo_data_8.js not found in data/ folder')"></script>
        <script src="Congo_data_8.js" onerror="console.warn('Congo_data_8.js not found in root folder')"></script>

        <script>
        // 1. Initialize Map centered on DRC
        var map = L.map('map', {
            zoomControl: true, 
            maxZoom: 18, 
            minZoom: 2
        }).setView([-2.5, 23.5], 6);

        // 2. Add Base Map Layer (OpenStreetMap)
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 3. Add Temporal UI Slider Box
        var sliderDiv = document.createElement('div');
        sliderDiv.className = 'timeline-control';
        sliderDiv.innerHTML = `
            <div><b>Date Filter:</b> <span id="time-display">2026-01-01</span></div>
            <input type="range" id="time-slider" min="1" max="4" value="1" step="1">
        `;
        document.body.appendChild(sliderDiv);

        // 4. Temporal Filter Logic ('date' and 'end_date')
        var dates = ["2026-01-01", "2026-03-01", "2026-05-01", "2026-07-01"];

        document.getElementById('time-slider').addEventListener('input', function(e) {
            var idx = parseInt(e.target.value) - 1;
            var selectedDateStr = dates[idx];
            document.getElementById('time-display').innerText = selectedDateStr;

            var selectedDate = new Date(selectedDateStr);

            map.eachLayer(function(layer) {
                if (layer.eachLayer) {
                    layer.eachLayer(function(subLayer) {
                        if (subLayer.feature && subLayer.feature.properties) {
                            var props = subLayer.feature.properties;
                            if (props.date) {
                                var start = new Date(props.date);
                                var end = props.end_date ? new Date(props.end_date) : start;

                                var isVisible = (selectedDate >= start && selectedDate <= end);
                                if (subLayer._path) subLayer._path.style.display = isVisible ? 'block' : 'none';
                                if (subLayer.getElement && subLayer.getElement()) {
                                    subLayer.getElement().style.display = isVisible ? 'block' : 'none';
                                }
                            }
                        }
                    });
                }
            });
        });
        </script>
    </body>
</html>
